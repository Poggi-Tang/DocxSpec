name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/docxspec
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tool
        run: python -m pip install --upgrade pip build

      - name: Build
        run: python -m build

      - name: Test the packaged report API
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          python -m pip install "${wheel}[report]" "pytest>=8"
          python -m pytest tests/test_report_bundle.py -q

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
